<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pawnshop Tablet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08090c;--panel:#11141a;--panel2:#171b22;--line:#2b303a;--gold:#f5bb36;--gold2:#ffe18a;--muted:#9298a5;--blue:#3d7dff;--green:#55e36e;--red:#ff6262}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#291a08 0,transparent 30%),radial-gradient(circle at 100% 0,#071c3d 0,transparent 30%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);padding:32px;border:1px solid #413825;border-radius:24px;background:linear-gradient(150deg,#171a20,#0d0f13);box-shadow:0 30px 100px #000b;text-align:center}.logo{width:62px;height:62px;margin:auto;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe28a,#a86b0e);color:#111;font-size:28px;box-shadow:0 0 30px #f5bb3640}.loginbox h1{letter-spacing:3px;margin:16px 0 4px}.sub{font-size:10px;color:#858b98;letter-spacing:3px}.field{text-align:left;margin:13px 0}.field label{display:block;font-size:10px;color:#9298a5;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#090b0f;color:#fff;outline:none}.field input:focus{border-color:var(--blue)}.btn,.primary{width:100%;padding:12px;border-radius:11px;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#ffd765,#aa700e);color:#111;font-weight:900}.btn{border:1px solid var(--line);background:#171a21;color:#ddd}.switch{font-size:11px;color:#8d93a0;margin-top:15px;cursor:pointer}.switch b{color:var(--gold2)}.error{height:16px;color:#ff7373;font-size:11px;margin:7px 0}
.app{max-width:1450px;margin:auto;padding:14px}.top{min-height:70px;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #403725;background:#0c0f14e8;backdrop-filter:blur(18px);border-radius:20px;position:sticky;top:10px;z-index:10}.toplogo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe28a,#a86b0e);color:#111;font-size:22px}.brand b{font-size:19px;letter-spacing:2px}.brand small{display:block;color:#858b98;font-size:8px;letter-spacing:2px}.nav{display:flex;gap:4px;margin-left:10px}.nav button{border:1px solid transparent;background:transparent;color:#9298a5;border-radius:10px;padding:9px 11px;cursor:pointer}.nav button.active,.nav button:hover{background:#181c24;border-color:#303641;color:#fff}.search{margin-left:auto}.search input{width:220px;background:#11151c;border:1px solid var(--line);border-radius:10px;color:#fff;padding:9px 11px}.user{display:flex;align-items:center;gap:8px;background:#171a21;border:1px solid var(--line);padding:7px 10px;border-radius:11px;font-size:11px}.avatar{width:29px;height:29px;border-radius:9px;background:#234b9c;display:grid;place-items:center;font-weight:800}.online{display:block;color:var(--green);font-size:8px}.logout{width:auto;padding:9px 11px}
.view{margin-top:15px}.hero{padding:27px;border:1px solid #493b23;border-radius:21px;background:linear-gradient(135deg,#19140c,#0f1218 65%)}.eyebrow{font-size:10px;color:var(--gold2);letter-spacing:3px;font-weight:800}.hero h1{font-size:clamp(30px,4vw,50px);margin:8px 0}.hero p{color:#9ca1ad}.actions{display:flex;gap:8px;margin-top:20px}.actions button{width:auto}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.kpi{padding:15px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(150deg,#161a21,#101217)}.kpi small{color:#858b98}.kpi b{display:block;font-size:23px;margin:5px 0}.green{color:var(--green);font-size:9px}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:13px}.toolbar{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.pill{white-space:nowrap;width:auto;border:1px solid var(--line);background:#11151b;color:#999;padding:9px 12px;border-radius:10px;cursor:pointer}.pill.active{border-color:#d39d32;background:#211a0c;color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{padding:13px;border:1px solid #292e38;border-radius:16px;background:linear-gradient(150deg,#171a22,#101218);min-height:145px;display:flex;flex-direction:column;justify-content:space-between}.card.selected{border-color:#d4a036}.line{display:flex;justify-content:space-between;gap:8px}.name{font-size:13px;font-weight:800}.tag{font-size:8px;color:#777d89;text-transform:uppercase;letter-spacing:1px}.price{font-size:11px;color:var(--gold2);margin-top:5px}.undefined{color:#777}.controls{display:grid;grid-template-columns:36px 1fr 36px;gap:6px}.step{border:1px solid #363b46;background:#1b1f27;color:#fff;border-radius:9px;cursor:pointer}.qty{width:100%;background:#090b0f;border:1px solid #363b46;color:#fff;text-align:center;border-radius:9px}.side{height:max-content;position:sticky;top:95px;padding:16px;border:1px solid #303641;border-radius:19px;background:linear-gradient(170deg,#171a22,#0d0f14)}.sidehead{display:flex;justify-content:space-between}.side h2{margin:0}.muted{font-size:10px;color:#858b98}.badge{background:#15351b;color:#62e878;border-radius:99px;padding:5px 8px;font-size:9px}.receipt{margin:13px 0;border-top:1px dashed #3a3f48;border-bottom:1px dashed #3a3f48;max-height:44vh;overflow:auto}.row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;font-size:11px}.totalbox{padding:13px 0}.totalbox small{color:#858b98}.total{font-size:37px;font-weight:950;color:var(--gold2)}.table{border:1px solid var(--line);border-radius:16px;overflow:auto;background:#101318}.tr{display:grid;grid-template-columns:1.2fr .8fr .8fr .9fr;min-width:650px;padding:12px 14px;border-bottom:1px solid #252a33;align-items:center}.tr:last-child{border:0}.th{color:#747a86;font-size:9px;letter-spacing:1px;text-transform:uppercase;background:#15181f}.tr span{font-size:11px}.amount{color:var(--gold2);font-weight:800}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid #3b414c;border-radius:20px;background:#12151b}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.modal .btn{width:auto}.danger{color:var(--red)}.toast{position:fixed;right:18px;bottom:18px;padding:11px 14px;border-radius:11px;border:1px solid #3b414c;background:#181c23;z-index:70;font-size:11px}
@media(max-width:1050px){.workspace{grid-template-columns:1fr}.side{position:static}.cards{grid-template-columns:repeat(2,1fr)}.nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.app{padding:8px}.top{position:static;flex-wrap:wrap}.search{order:5;flex-basis:100%}.search input{width:100%}.cards{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login"></div>
<div id="app" class="app hidden"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://umcrnbgwqjzlxdkazprs.supabase.co";
const SUPABASE_KEY="sb_publishable_IGCSkxfahw2cXU8n_IYn9g_rar1H9EI";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let profile=null,products=[],basket={},page="dashboard",category="Todos",searchText="";

const money=n=>new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2200)}
function technicalEmail(u){return u.toLowerCase().replace(/[^a-z0-9._-]/g,"_")+"@pawnshop.local"}

function loginScreen(signup=false){
 document.getElementById("login").innerHTML=`
 <div class="loginbox">
  <div class="logo">◆</div><h1>PAWNSHOP</h1><div class="sub">SISTEMA INTERNO</div>
  <div class="field"><label>Nome de utilizador</label><input id="loginUser" autocomplete="username" placeholder="Nome RP"></div>
  <div class="field"><label>Palavra-passe</label><input id="loginPass" type="password" autocomplete="${signup?"new-password":"current-password"}" placeholder="••••••••"></div>
  ${signup?`<div class="field"><label>Confirmar palavra-passe</label><input id="loginPass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>`:""}
  <div id="loginError" class="error"></div>
  <button class="primary" id="loginGo">${signup?"CRIAR CONTA":"ENTRAR"}</button>
  <div class="switch" id="switchLogin">${signup?"Já tens conta? <b>Entrar</b>":"Ainda não tens conta? <b>Criar conta</b>"}</div>
 </div>`;
 document.getElementById("loginGo").onclick=signup?signupUser:loginUser;
 document.getElementById("switchLogin").onclick=()=>loginScreen(!signup);
}
async function signupUser(){
 const u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value,p2=document.getElementById("loginPass2").value,e=document.getElementById("loginError");
 if(!/^[^@]{3,30}$/.test(u))return e.textContent="Nome inválido (3–30 caracteres).";
 if(p.length<6)return e.textContent="A palavra-passe deve ter pelo menos 6 caracteres.";
 if(p!==p2)return e.textContent="As palavras-passe não coincidem.";
 const {data,error}=await db.auth.signUp({email:technicalEmail(u),password:p,options:{data:{username:u,display_name:u}}});
 if(error)return e.textContent=error.message;
 if(!data.session)return e.textContent="Não foi possível iniciar a sessão.";
 try{await loadProfile();await showApp();toast("Conta criada com sucesso.")}catch(err){e.textContent="Conta criada, mas o perfil não ficou disponível."}
}
async function loginUser(){
 const u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value,e=document.getElementById("loginError");
 if(!u||!p)return e.textContent="Preenche os dois campos.";
 const {error}=await db.auth.signInWithPassword({email:technicalEmail(u),password:p});
 if(error)return e.textContent="Nome ou palavra-passe incorretos.";
 try{await loadProfile();await showApp()}catch(err){await db.auth.signOut();e.textContent="Perfil Pawnshop não encontrado."}
}
async function loadProfile(){
 const {data,error}=await db.rpc("get_my_profile");
 if(error||!data?.length)throw error||new Error("profile");
 profile=data[0];
}
async function loadProducts(){
 const {data,error}=await db.from("products").select("id,name,category,price,active").eq("active",true).order("name");
 if(error)throw error;products=data||[];
}
async function showApp(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 await loadProducts();render();
}
function total(){return Object.entries(basket).reduce((s,[id,q])=>s+q*(Number(products.find(p=>p.id==id)?.price)||0),0)}
function setPage(p){page=p;render()}
function setCategory(c){category=c;render()}
function filtered(){return products.filter(x=>(category==="Todos"||x.category===category)&&x.name.toLowerCase().includes(searchText.toLowerCase()))}
function changeQty(id,d){setQty(id,(basket[id]||0)+d)}
function setQty(id,q){q=Math.max(0,parseInt(q)||0);if(q)basket[id]=q;else delete basket[id];render()}
function productCard(x){const q=basket[x.id]||0,p=Number(x.price)||0;return `<div class="card ${q?"selected":""}"><div><div class="line"><div class="name">${esc(x.name)}</div><div class="tag">${esc(x.category)}</div></div><div class="price ${p?"":"undefined"}">${p?money(p)+" / un.":"Preço por definir"}</div></div><div class="controls"><button class="step" onclick="changeQty(${x.id},-1)">−</button><input class="qty" type="number" min="0" value="${q}" onchange="setQty(${x.id},this.value)"><button class="step" onclick="changeQty(${x.id},1)">＋</button></div></div>`}
function summary(){
 const entries=Object.entries(basket);
 return `<aside class="side"><div class="sidehead"><div><h2>Resumo</h2><div class="muted">Oferta de compra</div></div><span class="badge">${entries.reduce((s,[,q])=>s+q,0)} un.</span></div>
 <div class="receipt">${entries.length?entries.map(([id,q])=>{const x=products.find(p=>p.id==id),v=q*(Number(x?.price)||0);return `<div class="row"><span>${q}× ${esc(x?.name)}</span><strong>${money(v)}</strong></div>`}).join(""):"<div class='muted' style='padding:15px 0'>Ainda não foram adicionados itens.</div>"}</div>
 <div class="totalbox"><small>VALOR TOTAL</small><div class="total">${money(total())}</div></div>
 <div class="field"><label>Cliente / ID</label><input id="clientId" placeholder="Ex.: 4521"></div>
 <button class="primary" onclick="finishSale()">✓ FINALIZAR AVALIAÇÃO</button>
 <button class="btn" style="margin-top:8px" onclick="basket={};render()">Limpar</button></aside>`;
}
function evaluation(){
 return `<section class="view"><div class="pageTitle"><h2>Nova avaliação</h2><p class="muted">Introduz as quantidades entregues pelo cliente.</p></div>
 <div class="workspace"><div><div class="toolbar"><button class="pill ${category==="Todos"?"active":""}" onclick="setCategory('Todos')">Todos</button><button class="pill ${category==="Materiais"?"active":""}" onclick="setCategory('Materiais')">Materiais</button><button class="pill ${category==="Outros"?"active":""}" onclick="setCategory('Outros')">Outros itens</button></div>
 <div class="cards">${filtered().map(productCard).join("")}</div></div>${summary()}</div></section>`;
}
function dashboard(){
 return `<section class="view"><div class="hero"><div class="eyebrow">SISTEMA INTERNO • PAWNSHOP</div><h1>Bem-vindo, ${esc(profile.username)}.</h1><p>Central de avaliações, compras e controlo de preços.</p><div class="actions"><button class="primary" onclick="setPage('avaliacao')">＋ NOVA AVALIAÇÃO</button><button class="btn" onclick="setPage('historico')">Ver histórico</button></div></div>
 <div class="kpis"><div class="kpi"><small>PRODUTOS</small><b>${products.length}</b><span class="green">● catálogo online</span></div><div class="kpi"><small>ACESSO</small><b>${profile.role==="admin"?"ADMIN":"STAFF"}</b><span class="green">● sessão segura</span></div><div class="kpi"><small>BASE DE DADOS</small><b>ONLINE</b><span class="green">● Supabase</span></div><div class="kpi"><small>ESTADO</small><b>ATIVO</b><span class="green">● operacional</span></div></div></section>`;
}
async function finishSale(){
 const entries=Object.entries(basket).filter(([,q])=>q>0);if(!entries.length)return toast("Adiciona pelo menos um item.");
 const client=document.getElementById("clientId")?.value.trim()||"",tx="PS-"+Date.now().toString(36).toUpperCase();
 const items=entries.map(([id,q])=>({product_id:Number(id),quantity:q}));
 const {data,error}=await db.rpc("create_sale",{p_transaction_number:tx,p_client_id:client,p_items:items});
 if(error)return toast(error.message);
 const val=data?.[0]?.total??total();basket={};openModal(`<div class="modalhead"><div><h2>Avaliação concluída</h2><div class="muted">Transação ${esc(tx)}</div></div><button class="btn" onclick="closeModal()">Fechar</button></div><div style="padding-top:15px"><div class="total" style="text-align:center">${money(val)}</div><div style="text-align:center;color:var(--green);font-size:10px">✓ REGISTADA NA BASE DE DADOS</div></div>`);page="avaliacao";render();
}
async function history(){
 const {data,error}=await db.rpc("get_sales");if(error)return `<section class="view"><h2>Histórico</h2><p class="danger">${esc(error.message)}</p></section>`;
 const rows=data||[];return `<section class="view"><div class="pageTitle"><h2>Histórico</h2><p class="muted">Todas as avaliações registadas.</p></div><div class="table"><div class="tr th"><span>TRANSAÇÃO</span><span>FUNCIONÁRIO</span><span>VALOR</span><span>DATA</span></div>${rows.length?rows.map(x=>`<div class="tr"><span><b>${esc(x.transaction_number)}</b></span><span>${esc(x.staff)}</span><span class="amount">${money(x.total)}</span><span>${new Date(x.created_at).toLocaleString("pt-PT")}</span></div>`).join(""):"<div style='padding:18px;color:#858b98'>Nenhuma transação registada.</div>"}</div></section>`;
}
async function prices(){
 if(profile.role!=="admin")return `<section class="view"><h2>Gestão de preços</h2><p class="danger">Acesso reservado a administradores.</p></section>`;
 return `<section class="view"><div class="pageTitle"><h2>Gestão de preços</h2><p class="muted">Todas as alterações ficam registadas.</p></div><div class="table"><div class="tr th"><span>ITEM</span><span>CATEGORIA</span><span>PREÇO</span><span>AÇÃO</span></div>${products.map(x=>`<div class="tr"><span><b>${esc(x.name)}</b></span><span>${esc(x.category)}</span><span><input id="price-${x.id}" type="number" min="0" value="${Number(x.price)||0}" style="width:105px;padding:8px;background:#090b0f;color:#fff;border:1px solid #303640;border-radius:8px"> €</span><span><button class="btn" style="width:auto" onclick="savePrice(${x.id})">Guardar</button></span></div>`).join("")}</div></section>`;
}
async function savePrice(id){
 const value=Number(document.getElementById("price-"+id).value);if(!Number.isFinite(value)||value<0)return toast("Preço inválido.");
 const {error}=await db.rpc("update_product_price",{p_product_id:id,p_new_price:value});if(error)return toast(error.message);
 await loadProducts();toast("Preço alterado e registado.");render();
}
async function priceAudit(){
 if(profile.role!=="admin")return `<section class="view"><h2>Auditoria</h2><p class="danger">Acesso reservado a administradores.</p></section>`;
 const {data,error}=await db.rpc("get_price_changes");if(error)return `<section class="view"><p class="danger">${esc(error.message)}</p></section>`;
 return `<section class="view"><div class="pageTitle"><div><h2>Alterações de preços</h2><p class="muted">Quem alterou, antes, depois e quando.</p></div><button class="btn" style="width:auto;color:var(--red)" onclick="clearAudit()">🗑 Limpar auditoria</button></div><div class="table"><div class="tr th"><span>ITEM</span><span>ANTES</span><span>DEPOIS</span><span>QUEM / QUANDO</span></div>${(data||[]).map(x=>`<div class="tr"><span><b>${esc(x.product_name)}</b></span><span>${money(x.old_price)}</span><span class="amount">${money(x.new_price)}</span><span>${esc(x.changed_by)}<br><small>${new Date(x.created_at).toLocaleString("pt-PT")}</small></span></div>`).join("")||"<div style='padding:18px;color:#858b98'>Nenhuma alteração registada.</div>"}</div></section>`;
}
async function clearAudit(){
 if(profile.role!=="admin") return toast("Acesso reservado a administradores.");
 if(!confirm("Apagar todo o histórico de alterações de preços?\n\nIsto não altera os preços atuais.")) return;
 const {error}=await db.rpc("clear_price_changes");
 if(error) return toast(error.message);
 toast("Auditoria limpa.");
 render();
}
async function staff(){
 if(profile.role!=="admin")return `<section class="view"><h2>Contas</h2><p class="danger">Acesso reservado a administradores.</p></section>`;
 const {data,error}=await db.rpc("get_staff");if(error)return `<section class="view"><p class="danger">${esc(error.message)}</p></section>`;
 return `<section class="view"><div class="pageTitle"><h2>Contas</h2><p class="muted">Gerir permissões Pawnshop.</p></div><div class="table"><div class="tr th"><span>UTILIZADOR</span><span>CARGO</span><span>CRIADO</span><span>AÇÃO</span></div>${(data||[]).map(x=>`<div class="tr"><span><b>${esc(x.username)}</b></span><span>${x.role==="admin"?"👑 Admin":"Funcionário"}</span><span>${new Date(x.created_at).toLocaleDateString("pt-PT")}</span><span>${x.id===profile.id?"—":`<button class="btn" style="width:auto" onclick="changeRole('${x.id}','${x.role==="admin"?"employee":"admin"}')">${x.role==="admin"?"Remover Admin":"Dar Admin"}</button>`}</span></div>`).join("")}</div></section>`;
}
async function changeRole(id,role){const {error}=await db.rpc("set_staff_role",{p_user_id:id,p_new_role:role});if(error)return toast(error.message);toast("Permissão alterada.");render()}
function nav(){
 return `<header class="top"><div class="toplogo">◆</div><div class="brand"><b>PAWNSHOP</b><small>BUY • SELL • TRADE</small></div><nav class="nav"><button class="${page==="dashboard"?"active":""}" onclick="setPage('dashboard')">Dashboard</button><button class="${page==="avaliacao"?"active":""}" onclick="setPage('avaliacao')">Avaliação</button><button class="${page==="historico"?"active":""}" onclick="setPage('historico')">Histórico</button>${profile.role==="admin"?`<button class="${page==="precos"?"active":""}" onclick="setPage('precos')">Preços</button><button class="${page==="auditoria"?"active":""}" onclick="setPage('auditoria')">Auditoria</button><button class="${page==="staff"?"active":""}" onclick="setPage('staff')">Contas</button>`:""}</nav><div class="search"><input id="globalSearch" placeholder="Pesquisar item..." value="${esc(searchText)}"></div><div class="user"><div class="avatar">${esc((profile.username||"P")[0].toUpperCase())}</div><div><b>${esc(profile.username)}</b><span class="online">● ONLINE</span></div></div><button class="btn logout" onclick="logout()">Sair</button></header>`;
}
async function render(){
 let content=page==="dashboard"?dashboard():page==="avaliacao"?evaluation():page==="historico"?await history():page==="precos"?await prices():page==="auditoria"?await priceAudit():await staff();
 document.getElementById("app").innerHTML=nav()+content;
 const s=document.getElementById("globalSearch");if(s)s.oninput=e=>{searchText=e.target.value;page="avaliacao";render()}
}
function openModal(c){document.getElementById("modal").innerHTML=`<div class="modalbox">${c}</div>`;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden");document.getElementById("modal").innerHTML=""}
async function logout(){await db.auth.signOut();profile=null;products=[];basket={};document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden");loginScreen()}
async function init(){
 const {data}=await db.auth.getSession();
 if(!data.session)return loginScreen();
 try{await loadProfile();await showApp()}catch(e){await db.auth.signOut();loginScreen()}
}
init();
</script>
</body>
</html>
